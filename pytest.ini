[tool:pytest]
# Pytest configuration for Ethereum Fraud Detection System
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
markers =
    unit: Unit tests
    integration: Integration tests
    api: API tests
    web: Web interface tests
    model: Model training tests
    oracle: Oracle service tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
